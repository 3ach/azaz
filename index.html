<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Embedding Explorer — GPT-2</title>
    <meta
      name="description"
      content="An interactive reading of GPT-2's token embeddings: type a word and wander its 768 dimensions."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Spectral+SC:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app">
      <header class="masthead">
        <img
          class="azaz"
          src="/king-azaz.svg"
          width="160"
          height="200"
          alt="King Azaz the Unabridged, seated on his throne"
        />
        <h1>The Embedding Explorer</h1>

        <div class="search">
          <input
            id="search"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Type a word — try “king”, “ocean”, or “tokenization”"
          />
        </div>
        <div id="tokens" class="tokens" aria-live="polite"></div>
        <p id="hint" class="hint"></p>
      </header>

      <section id="selection" class="selection" hidden>
        <div class="selection-head">
          <div class="selected-word">
            <span class="selected-label">Now exploring</span>
            <span id="selected-token" class="selected-token"></span>
          </div>
          <div id="overall" class="overall"></div>
        </div>

        <div class="controls">
          <div class="legend">
            <span class="swatch target"></span>this word
            <span class="swatch near"></span>nearest in dimension
            <span class="swatch far"></span>farthest in dimension
          </div>
          <label class="sort-control">
            order
            <select id="sort">
              <option value="distinct">most distinctive first</option>
              <option value="index">dimension number</option>
            </select>
          </label>
        </div>

        <div id="dims" class="dims"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
